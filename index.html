<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Web Engine 3D</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; user-select: none; }
        
        /* Главное меню */
        #main-menu {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1607988795691-3d0147b43231?q=80&w=1000') no-repeat center center;
            background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .game-title { font-size: 56px; color: #f3ad16; text-shadow: 4px 4px #3f2a04; font-weight: bold; margin-bottom: 40px; }
        .menu-btn {
            width: 300px; padding: 15px; margin: 10px; background: #5c5c5c; border: 3px solid #000;
            color: #fff; font-size: 20px; cursor: pointer; text-align: center; box-shadow: inset -4px -4px #3a3a3a, inset 4px 4px #7a7a7a;
        }
        .menu-btn:hover { background: #6c8c5c; }

        /* Игровой интерфейс */
        #game-ui { display: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); color: rgba(255,255,255,0.7); font-size: 28px;
            pointer-events: none; text-align: center; line-height: 18px; z-index: 10;
        }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; background: rgba(0,0,0,0.5); padding: 5px; border: 3px solid #333; border-radius: 4px;
        }
        .slot {
            width: 45px; height: 45px; margin: 0 4px; border: 2px solid #555;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold;
        }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.2); }
        
        #debug-info {
            position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.6);
            padding: 10px; font-size: 12px; line-height: 1.4; border-radius: 5px; pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="main-menu">
    <div class="game-title">MINECRAFT JS</div>
    <div class="menu-btn" id="start-game-btn">ОДНОПОЛЬЗОВАТЕЛЬСКАЯ</div>
    <div class="menu-btn" style="opacity:0.5; cursor:not-allowed;">МУЛЬТИПЛЕЕР</div>
</div>

<div id="game-ui">
    <div id="crosshair">+</div>
    <div id="debug-info">FPS: -- | Чанки: <span id="chunk-count">0</span><br>Позиция: X: <span id="pos-x">0</span> Y: <span id="pos-y">0</span> Z: <span id="pos-z">0</span><br>Блок в руке: <span id="current-block">Трава</span></div>
    <div id="hotbar">
        <div class="slot active" data-block="grass" style="background-color: #5e9e3b;">Трава</div>
        <div class="slot" data-block="dirt" style="background-color: #866043;">Земля</div>
        <div class="slot" data-block="stone" style="background-color: #73737d;">Камень</div>
        <div class="slot" data-block="wood" style="background-color: #946742;">Дерево</div>
    </div>
</div>

<script>
// --- МАТЕМАТИЧЕСКИЙ ШУМ ДЛЯ ГЕНЕРАЦИИ БЕСКОНЕЧНЫХ ЧАНКОВ ---
function hash2D(x, z) {
    let h = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453123;
    return h - Math.floor(h);
}
function noise2D(x, z) {
    let X = Math.floor(x), Z = Math.floor(z);
    let fx = x - X, fz = z - Z;
    let v1 = hash2D(X, Z), v2 = hash2D(X + 1, Z);
    let v3 = hash2D(X, Z + 1), v4 = hash2D(X + 1, Z + 1);
    let u = fx * fx * (3.0 - 2.0 * fx), v = fz * fz * (3.0 - 2.0 * fz);
    return THREE.MathUtils.lerp(THREE.MathUtils.lerp(v1, v2, u), THREE.MathUtils.lerp(v3, v4, u), v);
}
function getTerrainHeight(x, z) {
    // Карта 10000x10000
    if (Math.abs(x) > 5000 || Math.abs(z) > 5000) return 0;
    let n = noise2D(x * 0.005, z * 0.005) * 15;
    n += noise2D(x * 0.02, z * 0.02) * 5;
    return Math.floor(n) + 6;
}

// --- НАСТРОЙКИ ДВИЖКА ---
const CHUNK_SIZE = 16;
const CHUNK_HEIGHT = 32;
const RENDER_DISTANCE = 4; // Радиус прорисовки чанков вокруг игрока
const WATER_LEVEL = 7;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x78a7ff);
scene.fog = new THREE.FogExp2(0x78a7ff, 0.015);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// СВЕТ
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.5);
sun.position.set(100, 200, 50);
scene.add(sun);

// МАТЕРИАЛЫ
const blockMaterials = {
    grass: new THREE.MeshLambertMaterial({ color: 0x5e9e3b }),
    dirt: new THREE.MeshLambertMaterial({ color: 0x866043 }),
    stone: new THREE.MeshLambertMaterial({ color: 0x73737d }),
    wood: new THREE.MeshLambertMaterial({ color: 0x946742 }),
    leaves: new THREE.MeshLambertMaterial({ color: 0x3b823e }),
    water: new THREE.MeshLambertMaterial({ color: 0x3b66cc, transparent: true, opacity: 0.6 })
};
const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

// ХРАНИЛИЩЕ ДАННЫХ МИРА
const worldBlocks = new Map(); 
const chunks = new Map();      
const mobs = [];

function blockKey(x, y, z) { return `${x},${y},${z}`; }
function chunkKey(cx, cz) { return `${cx},${cz}`; }

// --- СИСТЕМА ДИНАМИЧЕСКИХ ЧАНКОВ ---
function generateChunkData(cx, cz) {
    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            let wx = cx * CHUNK_SIZE + x;
            let wz = cz * CHUNK_SIZE + z;
            let surface = getTerrainHeight(wx, wz);

            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let key = blockKey(wx, y, wz);
                if (worldBlocks.has(key)) continue; // Пропуск если блок изменен игроком

                let type = null;
                // Генерация пещер через 3D математические полости
                let isCave = y < surface - 2 && (Math.sin(wx*0.2) + Math.cos(y*0.3) + Math.sin(wz*0.2) > 1.1);

                if (!isCave) {
                    if (y === surface) type = (y <= WATER_LEVEL + 1) ? 'dirt' : 'grass';
                    else if (y < surface && y > surface - 4) type = 'dirt';
                    else if (y <= surface - 4) type = 'stone';
                    else if (y <= WATER_LEVEL) type = 'water';
                }
                if (type) worldDataSet(wx, y, wz, type);
            }

            // Деревья
            if (surface > WATER_LEVEL + 1 && hash2D(wx, wz) < 0.015) {
                for(let h=1; h<=4; h++) worldDataSet(wx, surface+h, wz, 'wood');
                for(let lx=-1; lx<=1; lx++) {
                    for(let ly=3; ly<=5; ly++) {
                        for(let lz=-1; lz<=1; lz++) {
                            worldDataSet(wx+lx, surface+ly, wz+lz, 'leaves');
                        }
                    }
                }
            }
        }
    }
}

function worldDataSet(x, y, z, type) {
    worldBlocks.set(blockKey(x, y, z), type);
}
function worldDataGet(x, y, z) {
    return worldBlocks.get(blockKey(Math.round(x), Math.round(y), Math.round(z)));
}

function buildChunkMesh(cx, cz) {
    let key = chunkKey(cx, cz);
    if (chunks.has(key)) return;

    const group = new THREE.Group();
    const instanced = {};
    const counts = {};

    // Подсчет типов блоков
    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let type = worldBlocks.get(blockKey(cx * CHUNK_SIZE + x, y, cz * CHUNK_SIZE + z));
                if (type) counts[type] = (counts[type] || 0) + 1;
            }
        }
    }

    // Инициализация InstancedMesh для оптимизации рендера чанка
    Object.keys(counts).forEach(type => {
        instanced[type] = {
            mesh: new THREE.InstancedMesh(blockGeometry, blockMaterials[type], counts[type]),
            idx: 0
        };
        group.add(instanced[type].mesh);
    });

    const dummy = new THREE.Object3D();
    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let wx = cx * CHUNK_SIZE + x;
                let wz = cz * CHUNK_SIZE + z;
                let type = worldBlocks.get(blockKey(wx, y, wz));
                if (!type) continue;

                dummy.position.set(wx, y, wz);
                dummy.updateMatrix();
                instanced[type].mesh.setMatrixAt(instanced[type].idx, dummy.matrix);
                instanced[type].idx++;
            }
        }
    }

    scene.add(group);
    chunks.set(key, group);
}

function updateChunksAroundPlayer() {
    let pX = Math.floor(player.pos.x / CHUNK_SIZE);
    let pZ = Math.floor(player.pos.z / CHUNK_SIZE);

    // Создаем новые чанки
    for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
        for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
            generateChunkData(pX + x, pZ + z);
            buildChunkMesh(pX + x, pZ + z);
        }
    }
    document.getElementById('chunk-count').innerText = chunks.size;
}

function rebuildTargetChunk(x, z) {
    let cx = Math.floor(x / CHUNK_SIZE);
    let cz = Math.floor(z / CHUNK_SIZE);
    let key = chunkKey(cx, cz);
    if (chunks.has(key)) {
        scene.remove(chunks.get(key));
        chunks.delete(key);
    }
    buildChunkMesh(cx, cz);
}

// --- СИСТЕМА МОБОВ (NPC) ---
class Mob {
    constructor(x, z) {
        this.mesh = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 1.2),
            new THREE.MeshLambertMaterial({ color: 0xffaaaa }) // Розовая свинка
        );
        this.pos = new THREE.Vector3(x, getTerrainHeight(x, z) + 2, z);
        this.mesh.position.copy(this.pos);
        scene.add(this.mesh);
        this.vel = new THREE.Vector3();
        this.dirTime = 0;
        this.moveDir = new THREE.Vector3();
    }
    update(dt) {
        this.dirTime -= dt;
        if (this.dirTime <= 0) {
            this.dirTime = 2 + Math.random() * 3;
            this.moveDir.set(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
        }
        
        this.vel.x = this.moveDir.x * 2;
        this.vel.z = this.moveDir.z * 2;
        this.vel.y -= 12 * dt; // Гравитация моба

        let nextX = this.pos.x + this.vel.x * dt;
        let nextZ = this.pos.z + this.vel.z * dt;
        let nextY = this.pos.y + this.vel.y * dt;

        // Если перед мобом стена — он пытается запрыгнуть
        if (worldDataGet(nextX, this.pos.y, this.pos.z)) this.vel.y = 5;
        if (worldDataGet(this.pos.x, this.pos.y, nextZ)) this.vel.y = 5;

        if (!worldDataGet(nextX, this.pos.y - 0.4, this.pos.z)) this.pos.x = nextX;
        if (!worldDataGet(this.pos.x, this.pos.y - 0.4, nextZ)) this.pos.z = nextZ;

        if (worldDataGet(this.pos.x, nextY - 0.4, this.pos.z)) {
            this.vel.y = 0;
        } else {
            this.pos.y = nextY;
        }
        this.mesh.position.copy(this.pos);
    }
}

// --- ФИЗИКА ИГРОКА ---
class Player {
    constructor() {
        this.pos = new THREE.Vector3(0, 20, 0);
        this.vel = new THREE.Vector3();
        this.width = 0.5;
        this.height = 1.8;
        this.isSprinting = false;
    }
    update(dt, moveDir, jump) {
        this.vel.y -= 18 * dt;
        let speed = this.isSprinting ? 9.0 : 5.0;
        this.vel.x = moveDir.x * speed;
        this.vel.z = moveDir.z * speed;

        let onGround = worldDataGet(this.pos.x, this.pos.y - 1.8, this.pos.z);
        if (onGround && this.vel.y < 0) {
            this.vel.y = 0;
            if (jump) this.vel.y = 6.5;
        }

        let nextX = this.pos.x + this.vel.x * dt;
        if (!worldDataGet(nextX, this.pos.y - 0.9, this.pos.z) && !worldDataGet(nextX, this.pos.y - 1.7, this.pos.z)) this.pos.x = nextX;

        let nextZ = this.pos.z + this.vel.z * dt;
        if (!worldDataGet(this.pos.x, this.pos.y - 0.9, nextZ) && !worldDataGet(this.pos.x, this.pos.y - 1.7, nextZ)) this.pos.z = nextZ;

        let nextY = this.pos.y + this.vel.y * dt;
        if (worldDataGet(this.pos.x, nextY - 1.8, this.pos.z)) this.vel.y = 0;
        else this.pos.y = nextY;
    }
}

const player = new Player();
let isLocked = false;
let selectedBlock = 'grass';

// --- ЛОМАНИЕ И СТАВКА БЛОКОВ (RAYCASTING) ---
function interactWorld(isDestroy) {
    if (!isLocked) return;
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    
    // Получаем список пересечений луча с чанками
    const intersects = raycaster.intersectObjects(Array.from(chunks.values()), true);
    if (intersects.length > 0 && intersects[0].distance < 6) {
        let hit = intersects[0];
        let p = hit.point;
        let n = hit.face.normal;

        // Рассчитываем координаты целевого блока
        let bx = Math.round(p.x - n.x * 0.5);
        let by = Math.round(p.y - n.y * 0.5);
        let bz = Math.round(p.z - n.z * 0.5);

        if (isDestroy) {
            worldBlocks.delete(blockKey(bx, by, bz));
            rebuildTargetChunk(bx, bz);
        } else {
            // Ставим блок с учетом нормали грани куба
            let px = bx + n.x;
            let py = by + n.y;
            let pz = bz + n.z;
            worldBlocks.set(blockKey(px, py, pz), selectedBlock);
            rebuildTargetChunk(px, pz);
        }
    }
}

// --- ОБРАБОТЧИКИ СОБЫТИЙ КЛАВИАТУРЫ ---
const keys = { w: false, a: false, s: false, d: false, space: false };
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') keys.space = true;
    if (e.key === 'w' || e.key === 'ц') keys.w = true;
    if (e.key === 's' || e.key === 'ы') keys.s = true;
    if (e.key === 'a' || e.key === 'ф') keys.a = true;
    if (e.key === 'd' || e.key === 'в') keys.d = true;
    if (e.key === 'Shift') player.isSprinting = true;
    
    // Выбор блоков на кнопках 1-4
    if (['1','2','3','4'].includes(e.key)) {
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
        let slots = document.querySelectorAll('.slot');
        let idx = parseInt(e.key) - 1;
        slots[idx].classList.add('active');
        selectedBlock = slots[idx].dataset.block;
        document.getElementById('current-block').innerText = slots[idx].innerText;
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') keys.space = false;
    if (e.key === 'w' || e.key === 'ц') keys.w = false;
    if (e.key === 's' || e.key === 'ы') keys.s = false;
    if (e.key === 'a' || e.key === 'ф') keys.a = false;
    if (e.key === 'd' || e.key === 'в') keys.d = false;
    if (e.key === 'Shift') player.isSprinting = false;
});

window.addEventListener('mousedown', (e) => {
    if(e.button === 0) interactWorld(true);  // ЛКМ - сломать
    if(e.button === 2) interactWorld(false); // ПКМ - поставить
});

// ОБЗОР МЫШЬЮ
let pitch = 0, yaw = 0;
document.addEventListener('mousemove', (e) => {
    if (!isLocked) return;
    yaw -= e.movementX * 0.0025;
    pitch -= e.movementY * 0.0025;
    pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
});

// УПРАВЛЕНИЕ МЕНЮ
document.getElementById('start-game-btn').addEventListener('click', () => {
    document.body.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
    isLocked = document.pointerLockElement === document.body;
    if(isLocked) {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
    } else {
        document.getElementById('main-menu').style.display = 'flex';
        document.getElementById('game-ui').style.display = 'none';
    }
});

// СПАВН СТАРТОВЫХ МОБОВ
for(let i=0; i<15; i++) {
    mobs.push(new Mob((Math.random()-0.5)*40, (Math.random()-0.5)*40));
}

// --- ЦИКЛ РЕНДЕРА И ОБНОВЛЕНИЯ МИРА ---
const clock = new THREE.Clock();
function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.1);

    if (isLocked) {
        const front = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        front.y = 0; front.normalize();
        side.y = 0; side.normalize();

        let moveDir = new THREE.Vector3();
        if (keys.w) moveDir.add(front);
        if (keys.s) moveDir.sub(front);
        if (keys.d) moveDir.add(side);
        if (keys.a) moveDir.sub(side);
        moveDir.normalize();

        player.update(dt, moveDir, keys.space);
        camera.position.copy(player.pos);

        // Динамический FOV при быстром беге
        let targetFOV = player.isSprinting ? 80 : 70;
        if(camera.fov !== targetFOV) {
            camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.1);
            camera.updateProjectionMatrix();
        }

        // Обновляем чанки вокруг текущей позиции игрока
        updateChunksAroundPlayer();

        // Обновление физики ИИ мобов
        mobs.forEach(mob => mob.update(dt));

        // Вывод координат в дебаг-панель
        document.getElementById('pos-x').innerText = Math.round(player.pos.x);
        document.getElementById('pos-y').innerText = Math.round(player.pos.y);
        document.getElementById('pos-z').innerText = Math.round(player.pos.z);
    }
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

loop();
</script>
</body>
</html>
