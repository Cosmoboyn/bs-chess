<script>
// --- ХОРРОР АУДИОДВИЖОК ---
let audioCtx = null;
function initAudio() { 
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
}
function playScreamSound() {
    if(!audioCtx) return;
    let osc = audioCtx.createOscillator(); 
    let gain = audioCtx.createGain();
    osc.type = 'sawtooth'; 
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.8);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
    osc.connect(gain); 
    gain.connect(audioCtx.destination); 
    osc.start(); 
    osc.stop(audioCtx.currentTime + 0.8);
}
function playAmbientGloom() {
    if(!audioCtx) return;
    setInterval(() => {
        if(!isLocked) return;
        let osc = audioCtx.createOscillator(); 
        let gain = audioCtx.createGain();
        osc.type = 'sine'; 
        osc.frequency.setValueAtTime(55 + Math.random()*15, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime); 
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.0);
        osc.connect(gain); 
        gain.connect(audioCtx.destination); 
        osc.start(); 
        osc.stop(audioCtx.currentTime + 3.0);
    }, 4500);
}

// --- МАТЕМАТИКА ГЕНЕРАЦИИ КАРТЫ ---
function hash2D(x, z) { 
    let h = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453123;
    return h - Math.floor(h); 
}
function noise2D(x, z) {
    let X = Math.floor(x), Z = Math.floor(z);
    let fx = x - X, fz = z - Z;
    let v1 = Math.abs(hash2D(X, Z)); 
    let v2 = Math.abs(hash2D(X + 1, Z));
    return THREE.MathUtils.lerp(v1, v2, fx * fx * (3.0 - 2.0 * fx));
}
function getTerrainHeight(x, z) { 
    return Math.floor(noise2D(x * 0.015, z * 0.015) * 10) + 5; 
}

// --- ИГРОВОЙ ДВИЖОК THREE.JS ---
const CHUNK_SIZE = 16;
const CHUNK_HEIGHT = 24;
const RENDER_DISTANCE = 3;

const scene = new THREE.Scene(); 
const skyColor = new THREE.Color(0x5c78aa);
scene.background = skyColor.clone(); 
scene.fog = new THREE.FogExp2(0x5c78aa, 0.03);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight); 
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.3); 
sun.position.set(20, 60, 10); 
scene.add(sun);

const blockMaterials = {
    grass: new THREE.MeshLambertMaterial({ color: 0x5e9e3b }), 
    dirt: new THREE.MeshLambertMaterial({ color: 0x866043 }),
    stone: new THREE.MeshLambertMaterial({ color: 0x73737d }), 
    wood: new THREE.MeshLambertMaterial({ color: 0xb58a55 }),
    leaves: new THREE.MeshLambertMaterial({ color: 0x2d6130 }), 
    diamond: new THREE.MeshLambertMaterial({ color: 0x4dedf0 }),
    brick: new THREE.MeshLambertMaterial({ color: 0x9c4a3a }), 
    glass: new THREE.MeshLambertMaterial({ color: 0xc8f0ff, transparent: true, opacity: 0.5 }),
    sponge: new THREE.MeshLambertMaterial({ color: 0xc2ba46 })
};
const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
const worldBlocks = new Map(); 
const chunks = new Map();

function blockKey(x, y, z) { 
    return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`; 
}

// Полноценная генерация ландшафта (коллизия деревьев сохранена)
function generateChunk(cx, cz) {
    let cKey = `${cx},${cz}`; 
    if (chunks.has(cKey)) return;

    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            let wx = cx * CHUNK_SIZE + x;
            let wz = cz * CHUNK_SIZE + z;
            let surface = getTerrainHeight(wx, wz);
            
            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let type = null;
                if (y === surface) type = 'grass';
                else if (y < surface && y > surface - 3) type = 'dirt';
                else if (y <= surface - 3) type = (Math.abs(hash2D(wx, y)) < 0.02) ? 'diamond' : 'stone';
                
                if (type) worldBlocks.set(blockKey(wx, y, wz), type);
            }
            
            // Стволы деревьев (Жесткая физика)
            if (Math.abs(hash2D(wx, wz)) < 0.02 && surface > 4) {
                for(let h = 1; h <= 4; h++) {
                    worldBlocks.set(blockKey(wx, surface + h, wz), 'wood');
                }
                for(let lx = -1; lx <= 1; lx++) {
                    for(let ly = 4; ly <= 5; ly++) {
                        for(let lz = -1; lz <= 1; lz++) {
                            if(lx === 0 && lz === 0 && ly === 4) continue;
                            worldBlocks.set(blockKey(wx + lx, surface + ly, wz + lz), 'leaves');
                        }
                    }
                }
            }
        }
    }

    const group = new THREE.Group(); 
    const meshTypes = {};
    
    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let type = worldBlocks.get(blockKey(cx * CHUNK_SIZE + x, y, cz * CHUNK_SIZE + z));
                if (type) meshTypes[type] = (meshTypes[type] || 0) + 1;
            }
        }
    }
    
    Object.keys(meshTypes).forEach(t => {
        meshTypes[t] = { mesh: new THREE.InstancedMesh(blockGeometry, blockMaterials[t], meshTypes[t]), idx: 0 };
        group.add(meshTypes[t].mesh);
    });
    
    const dummy = new THREE.Object3D();
    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let wx = cx * CHUNK_SIZE + x;
                let wz = cz * CHUNK_SIZE + z;
                let type = worldBlocks.get(blockKey(wx, y, wz));
                if (!type) continue; 
                dummy.position.set(wx, y, wz); 
                dummy.updateMatrix();
                meshTypes[type].mesh.setMatrixAt(meshTypes[type].idx++, dummy.matrix);
            }
        }
    }
    scene.add(group); 
    chunks.set(cKey, group);
}

function updateWorld() {
    let pX = Math.floor(player.pos.x / CHUNK_SIZE);
    let pZ = Math.floor(player.pos.z / CHUNK_SIZE);
    for(let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
        for(let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) { 
            generateChunk(pX + x, pZ + z); 
        }
    }
}

// --- ФИЗИКА ИГРОКА ---
class PlayerPhysics {
    constructor() { 
        this.pos = new THREE.Vector3(0, 15, 0); 
        this.vel = new THREE.Vector3(); 
        this.height = 1.7; 
    }
    update(dt, moveDir, jumpPressed) {
        this.vel.y -= 22 * dt; 
        this.vel.x = moveDir.x * 5.0; 
        this.vel.z = moveDir.z * 5.0;
        
        let nextX = this.pos.x + this.vel.x * dt;
        let nextZ = this.pos.z + this.vel.z * dt;

        let blockAtX = worldBlocks.get(blockKey(nextX, Math.floor(this.pos.y - 0.5), this.pos.z)) || worldBlocks.get(blockKey(nextX, Math.floor(this.pos.y - 1.4), this.pos.z));
        let blockAtZ = worldBlocks.get(blockKey(this.pos.x, Math.floor(this.pos.y - 0.5), nextZ)) || worldBlocks.get(blockKey(this.pos.x, Math.floor(this.pos.y - 1.4), nextZ));
        
        if (!blockAtX) this.pos.x = nextX; 
        if (!blockAtZ) this.pos.z = nextZ;

        let groundY = getTerrainHeight(this.pos.x, this.pos.z) + this.height;
        let blockUnder = worldBlocks.get(blockKey(this.pos.x, Math.floor(this.pos.y - this.height - 0.1), this.pos.z));
        if (blockUnder && blockUnder !== 'leaves') {
            let bY = Math.floor(this.pos.y - this.height - 0.1) + 1 + this.height;
            if(bY > groundY) groundY = bY;
        }
        
        if (this.pos.y <= groundY + 0.1) { 
            this.vel.y = Math.max(0, this.vel.y); 
            this.pos.y = groundY; 
            if (jumpPressed) this.vel.y = 7.5; 
        }
        this.pos.y += this.vel.y * dt; 
        if(this.pos.y < -10) this.pos.set(0, 15, 0);
    }
}
const player = new PlayerPhysics();

// --- СИСТЕМА СТАРЫХ КЛАССИЧЕСКИХ NPC И АНОМАЛИЙ ---
class AlphaNPC {
    constructor(x, z, isHerobrin = false) {
        this.isHero = isHerobrin; 
        this.group = new THREE.Group();
        
        let bodyMat = new THREE.MeshLambertMaterial({ color: isHerobrin ? 0x1133aa : 0xcc3333 });
        let headMat = isHerobrin ? new THREE.MeshBasicMaterial({ color: 0xffffff }) : new THREE.MeshLambertMaterial({ color: 0xffcc99 });
        
        let body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.0, 0.3), bodyMat); 
        body.position.y = 0.5;
        this.head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat); 
        this.head.position.y = 1.2;
        this.group.add(body, this.head);
        
        this.pos = new THREE.Vector3(x, getTerrainHeight(x, z) + 1.7, z);
        this.group.position.copy(this.pos); 
        scene.add(this.group);
        
        this.vel = new THREE.Vector3(); 
        this.dir = new THREE.Vector3(); 
        this.timer = 0;
    }
    update(dt) {
        if (this.isHero) {
            this.group.lookAt(player.pos.x, this.group.position.y, player.pos.z); 
            return;
        }
        
        // Классическое хаотичное блуждание и прыжки старых ботов
        this.timer -= dt;
        if(this.timer <= 0) {
            this.timer = 2 + Math.random() * 4;
            this.dir.set(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
            if(Math.random() < 0.4) this.vel.y = 6.0; 
        }
        
        this.vel.y -= 20 * dt; 
        this.vel.x = this.dir.x * 2.5; 
        this.vel.z = this.dir.z * 2.5;
        
        this.pos.x += this.vel.x * dt; 
        this.pos.z += this.vel.z * dt;
        
        let gy = getTerrainHeight(this.pos.x, this.pos.z) + 1.7;
        this.pos.y += this.vel.y * dt; 
        if(this.pos.y < gy) { 
            this.pos.y = gy; 
            this.vel.y = 0; 
        }
        
        this.group.position.copy(this.pos); 
        this.group.lookAt(this.pos.x + this.dir.x, this.pos.y, this.pos.z + this.dir.z);
    }
}

const npcs = []; 
let herobrin = null; 
let redChicken = null;
let anomalyTimer = 0; 
let skyDark = false; 
let skyTimer = 40;

function spawnHerobrin() {
    if(herobrin) scene.remove(herobrin.group);
    let ang = Math.random() * Math.PI * 2;
    herobrin = new AlphaNPC(player.pos.x + Math.cos(ang)*20, player.pos.z + Math.sin(ang)*20, true);
    playScreamSound(); 
    document.getElementById('warning-text').style.display = 'block';
    
    if(redChicken) scene.remove(redChicken);
    redChicken = new THREE.Group(); 
    let mat = new THREE.MeshLambertMaterial({ color: 0xd90404 });
    let b = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.5), mat); 
    let h = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.25, 0.25), mat); 
    h.position.set(0, 0.3, -0.2);
    redChicken.add(b, h); 
    redChicken.position.set(player.pos.x + (Math.random()-0.5)*6, getTerrainHeight(player.pos.x, player.pos.z)+0.5, player.pos.z + (Math.random()-0.5)*6);
    scene.add(redChicken);
}

function updateAnomalies(dt) {
    skyTimer -= dt;
    if(skyTimer <= 0) {
        skyDark = !skyDark; 
        skyTimer = skyDark ? 20 + Math.random()*15 : 60 + Math.random()*30;
        let c = skyDark ? new THREE.Color(0x000000) : skyColor; 
        scene.background = c; 
        scene.fog.color = c;
    }
    
    anomalyTimer += dt; 
    if(anomalyTimer > 30) { 
        anomalyTimer = 0; 
        if(Math.random() < 0.5) spawnHerobrin(); 
    }
    
    if(herobrin) {
        herobrin.update(dt);
        if(player.pos.distanceTo(herobrin.group.position) < 5) {
            scene.remove(herobrin.group); 
            herobrin = null; 
            document.getElementById('warning-text').style.display = 'none';
            playScreamSound(); 
            document.getElementById('screamer-overlay').style.display = 'block';
            setTimeout(() => document.getElementById('screamer-overlay').style.display = 'none', 350);
        }
    }
    npcs.forEach(n => n.update(dt));
}

// --- ПОЛНОЦЕННОЕ РАЗВЕРНУТОЕ УПРАВЛЕНИЕ ---
let isMobile = false; 
let isLocked = false; 
let selectedBlock = 'grass';

document.getElementById('choose-pc').onclick = function() { 
    isMobile = false; 
    document.getElementById('platform-menu').style.display = 'none'; 
    document.getElementById('main-menu').style.display = 'flex'; 
};
document.getElementById('choose-mobile').onclick = function() { 
    isMobile = true; 
    document.getElementById('platform-menu').style.display = 'none'; 
    document.getElementById('main-menu').style.display = 'flex'; 
    document.getElementById('mobile-controls').style.display = 'block'; 
};

function startGame(mode, code = "") {
    document.getElementById('main-menu').style.display = 'none'; 
    document.getElementById('game-ui').style.display = 'block';
    document.getElementById('game-mode').innerText = mode; 
    document.getElementById('debug-server-code').innerText = code ? "#" + code : "Локально";
    
    initAudio(); 
    playAmbientGloom();
    
    // Спавн 6 классических NPC
    for(let i = 0; i < 6; i++) {
        npcs.push(new AlphaNPC((Math.random() - 0.5) * 40, (Math.random() - 0.5) * 40, false));
    }
    
    updateWorld(); 
    if(!isMobile) document.body.requestPointerLock(); else isLocked = true;
}

document.getElementById('start-solo').onclick = () => startGame("Выживание", "");
document.getElementById('start-multi').onclick = () => document.getElementById('server-modal').style.display = 'block';
document.getElementById('connect-confirm-btn').onclick = () => {
    let c = document.getElementById('server-code-input').value.trim();
    if(c.length !== 3 || isNaN(c)) return alert("Нужно ровно 3 цифры!");
    document.getElementById('server-modal').style.display = 'none'; 
    startGame("Мультиплеер", c);
};

// Ввод клавиатуры (ПК)
const keys = { w: false, a: false, s: false, d: false, space: false };
window.addEventListener('keydown', (e) => {
    if(e.code === 'Space') keys.space = true; 
    if(e.key === 'w' || e.key === 'ц') keys.w = true; 
    if(e.key === 's' || e.key === 'ы') keys.s = true; 
    if(e.key === 'a' || e.key === 'ф') keys.a = true; 
    if(e.key === 'd' || e.key === 'в') keys.d = true;
    
    if(['1','2','3','4','5','6','7','8'].includes(e.key)) {
        let slots = document.querySelectorAll('.slot'); 
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
        let idx = parseInt(e.key) - 1; 
        slots[idx].classList.add('active'); 
        selectedBlock = slots[idx].dataset.block;
    }
});
window.addEventListener('keyup', (e) => {
    if(e.code === 'Space') keys.space = false; 
    if(e.key === 'w' || e.key === 'ц') keys.w = false; 
    if(e.key === 's' || e.key === 'ы') keys.s = false; 
    if(e.key === 'a' || e.key === 'ф') keys.a = false; 
    if(e.key === 'd' || e.key === 'в') keys.d = false;
});

// Клик по слотам хотбара
document.querySelectorAll('.slot').forEach(slot => {
    slot.addEventListener('pointerdown', (e) => {
        e.stopPropagation(); 
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
        slot.classList.add('active'); 
        selectedBlock = slot.dataset.block;
    });
});

// Постановка / разрушение блоков
function buildAction(isDestroy) {
    const raycaster = new THREE.Raycaster(); 
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects(scene.children, true);
    
    if(intersects.length > 0 && intersects[0].distance < 6) {
        let hit = intersects[0], p = hit.point, n = hit.face.normal;
        let bx = Math.round(p.x - n.x * 0.5), by = Math.round(p.y - n.y * 0.5), bz = Math.round(p.z - n.z * 0.5);
        
        if(isDestroy) {
            worldBlocks.delete(blockKey(bx, by, bz)); 
        } else {
            worldBlocks.set(blockKey(bx + n.x, by + n.y, bz + n.z), selectedBlock);
        }
        
        chunks.clear(); 
        scene.children = scene.children.filter(c => c.type !== "Group");
        npcs.forEach(n => scene.add(n.group)); 
        if(herobrin) scene.add(herobrin.group); 
        if(redChicken) scene.add(redChicken);
        updateWorld();
    }
}

// Слушатели событий мыши ПК
window.addEventListener('mousedown', (e) => { 
    if(!isMobile && isLocked) buildAction(e.button === 0); 
});

// Кнопки сенсора (Мобильные)
document.getElementById('m-destroy').addEventListener('pointerdown', () => buildAction(true));
document.getElementById('m-build').addEventListener('pointerdown', () => buildAction(false));
document.getElementById('jump-btn').addEventListener('pointerdown', () => { player.vel.y = 7.5; });

// Обзор мышью на ПК
let pitch = 0, yaw = 0;
document.addEventListener('mousemove', (e) => {
    if (!isLocked || isMobile) return;
    yaw -= e.movementX * 0.0025; 
    pitch -= e.movementY * 0.0025;
    pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
});

// Изолированный сенсорный обзор (Только правая половина экрана)
let touchStart = new THREE.Vector2();
window.addEventListener('touchstart', (e) => {
    for(let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i]; 
        if(t.clientX > window.innerWidth / 2) { 
            touchStart.set(t.clientX, t.clientY); 
        }
    }
});
window.addEventListener('touchmove', (e) => {
    for(let i = 0; i < e.touches.length; i++) {
        let t = e.touches[i];
        if(t.clientX > window.innerWidth / 2) {
            let dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
            yaw -= dx * 0.005; 
            pitch -= dy * 0.005;
            pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            touchStart.set(t.clientX, t.clientY);
        }
    }
});

// Виртуальный джойстик (Левая половина экрана)
let joyActive = false;
let joyStart = new THREE.Vector2(85, window.innerHeight - 85);
let joyMove = new THREE.Vector2();
const stick = document.getElementById('joystick-stick');

window.addEventListener('touchstart', (e) => {
    for(let i = 0; i < e.changedTouches.length; i++) {
        let t = e.changedTouches[i]; 
        if(t.clientX < window.innerWidth / 2) { 
            joyActive = true; 
            joyStart.set(t.clientX, t.clientY); 
        }
    }
});
window.addEventListener('touchmove', (e) => {
    if(!joyActive) return;
    for(let i = 0; i < e.touches.length; i++) {
        let t = e.touches[i];
        if(t.clientX < window.innerWidth / 2) {
            let dist = Math.min(35, joyStart.distanceTo(new THREE.Vector2(t.clientX, t.clientY)));
            let angle = Math.atan2(t.clientY - joyStart.y, t.clientX - joyStart.x);
            joyMove.set(Math.cos(angle) * dist, Math.sin(angle) * dist);
            stick.style.transform = `translate(${joyMove.x}px, ${joyMove.y}px)`;
        }
    }
});
window.addEventListener('touchend', (e) => {
    for(let i = 0; i < e.changedTouches.length; i++) {
        if(e.changedTouches[i].clientX < window.innerWidth / 2) { 
            joyActive = false; 
            joyMove.set(0, 0); 
            stick.style.transform = 'none'; 
        }
    }
});

document.addEventListener('pointerlockchange', () => { 
    if(!isMobile) isLocked = document.pointerLockElement === document.body; 
});

// --- СИСТЕМНЫЙ ИГРОВОЙ ЦИКЛ ---
const clock = new THREE.Clock();
function loop() {
    requestAnimationFrame(loop); 
    const dt = Math.min(clock.getDelta(), 0.1);
    
    if (isLocked) {
        let moveDir = new THREE.Vector3();
        const front = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        front.y = 0; front.normalize(); 
        side.y = 0; side.normalize();

        if (isMobile && joyActive) {
            moveDir.addScaledVector(front, -joyMove.y / 35); 
            moveDir.addScaledVector(side, joyMove.x / 35);
        } else {
            if (keys.w) moveDir.add(front); 
            if (keys.s) moveDir.sub(front);
            if (keys.d) moveDir.add(side); 
            if (keys.a) moveDir.sub(side);
        }
        moveDir.normalize(); 
        player.update(dt, moveDir, keys.space); 
        camera.position.copy(player.pos);

        updateWorld(); 
        updateAnomalies(dt);
        
        document.getElementById('pos-x').innerText = Math.round(player.pos.x);
        document.getElementById('pos-y').innerText = Math.round(player.pos.y);
        document.getElementById('pos-z').innerText = Math.round(player.pos.z);
    }
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => { 
    camera.aspect = window.innerWidth / window.innerHeight; 
    camera.updateProjectionMatrix(); 
    renderer.setSize(window.innerWidth, window.innerHeight); 
});

loop();
</script>
