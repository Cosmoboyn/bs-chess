<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Web Engine 3D - Fixed Edition</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Courier New', Courier, monospace; user-select: none; }
        
        /* Главное меню */
        #main-menu {
            position: absolute; width: 100%; height: 100%; z-index: 100;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1607988795691-3d0147b43231?q=80&w=1000') no-repeat center center;
            background-size: cover; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .game-title { font-size: 56px; color: #f3ad16; text-shadow: 4px 4px #3f2a04; font-weight: bold; margin-bottom: 40px; }
        .menu-btn {
            width: 320px; padding: 15px; margin: 10px; background: #5c5c5c; border: 3px solid #000;
            color: #fff; font-size: 20px; cursor: pointer; text-align: center; box-shadow: inset -4px -4px #3a3a3a, inset 4px 4px #7a7a7a;
        }
        .menu-btn:hover { background: #6c8c5c; }

        /* Игровой интерфейс */
        #game-ui { display: none; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            transform: translate(-50%, -50%); color: rgba(255,255,255,0.7); font-size: 28px;
            pointer-events: none; text-align: center; line-height: 18px; z-index: 10;
        }
        #hotbar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; background: rgba(0,0,0,0.6); padding: 5px; border: 3px solid #333; border-radius: 4px;
        }
        .slot {
            width: 50px; height: 50px; margin: 0 4px; border: 2px solid #555;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold;
        }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.3); }
        
        #debug-info {
            position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7);
            padding: 12px; font-size: 12px; line-height: 1.5; border-radius: 5px; pointer-events: none;
        }
        #chat {
            position: absolute; bottom: 90px; left: 20px; width: 320px; height: 180px;
            background: rgba(0,0,0,0.4); color: #fff; font-size: 13px; padding: 10px;
            overflow-y: hidden; display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none;
        }
        .chat-msg { margin-top: 4px; text-shadow: 1px 1px #000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="main-menu">
    <div class="game-title">MINECRAFT 3D</div>
    <button class="menu-btn" id="start-solo">ОДНОПОЛЬЗОВАТЕЛЬСКАЯ</button>
    <button class="menu-btn" id="start-multi">МУЛЬТИПЛЕЕР (СЕТЬ)</button>
</div>

<div id="game-ui">
    <div id="crosshair">+</div>
    <div id="debug-info">
        Чанки: <span id="chunk-count">0</span> | Игроков в сети: <span id="player-count">1</span><br>
        Позиция: X: <span id="pos-x">0</span> Y: <span id="pos-y">0</span> Z: <span id="pos-z">0</span><br>
        Режим: <span id="game-mode">Одиночный</span>
    </div>
    
    <div id="chat">
        <div class="chat-msg" style="color: #aaa;">[Система] Мир успешно сгенерирован!</div>
    </div>

    <div id="hotbar">
        <div class="slot active" data-block="grass" style="background-color: #5e9e3b;">Трава</div>
        <div class="slot" data-block="dirt" style="background-color: #866043;">Земля</div>
        <div class="slot" data-block="stone" style="background-color: #73737d;">Камень</div>
        <div class="slot" data-block="wood" style="background-color: #946742;">Дерево</div>
    </div>
</div>

<script>
// --- ШУМ И ГЕНЕРАЦИЯ ЛАНДШАФТА ---
function hash2D(x, z) {
    let h = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453123;
    return h - Math.floor(h);
}
function noise2D(x, z) {
    let X = Math.floor(x), Z = Math.floor(z);
    let fx = x - X, fz = z - Z;
    let v1 = hash2D(X, Z), v2 = hash2D(X + 1, Z);
    let v3 = hash2D(X, Z + 1), v4 = hash2D(X + 1, Z + 1);
    let u = fx * fx * (3.0 - 2.0 * fx), v = fz * fz * (3.0 - 2.0 * fz);
    return THREE.MathUtils.lerp(THREE.MathUtils.lerp(v1, v2, u), THREE.MathUtils.lerp(v3, v4, u), v);
}
function getTerrainHeight(x, z) {
    if (Math.abs(x) > 5000 || Math.abs(z) > 5000) return 0;
    let n = noise2D(x * 0.006, z * 0.006) * 16;
    n += noise2D(x * 0.03, z * 0.03) * 4;
    return Math.floor(n) + 8;
}

// --- НАСТРОЙКИ ---
const CHUNK_SIZE = 16;
const CHUNK_HEIGHT = 32;
const RENDER_DISTANCE = 4;
const WATER_LEVEL = 7;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x78a7ff);
scene.fog = new THREE.FogExp2(0x78a7ff, 0.015);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 0.45);
sun.position.set(80, 150, 40);
scene.add(sun);

const blockMaterials = {
    grass: new THREE.MeshLambertMaterial({ color: 0x5e9e3b }),
    dirt: new THREE.MeshLambertMaterial({ color: 0x866043 }),
    stone: new THREE.MeshLambertMaterial({ color: 0x73737d }),
    wood: new THREE.MeshLambertMaterial({ color: 0x946742 }),
    leaves: new THREE.MeshLambertMaterial({ color: 0x3b823e }),
    water: new THREE.MeshLambertMaterial({ color: 0x3b66cc, transparent: true, opacity: 0.6 })
};
const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

const worldBlocks = new Map(); 
const chunks = new Map();      
const mobs = [];
const remotePlayers = [];

function blockKey(x, y, z) { return `${Math.round(x)},${Math.round(y)},${Math.round(z)}`; }
function chunkKey(cx, cz) { return `${cx},${cz}`; }

function worldDataSet(x, y, z, type) { worldBlocks.set(blockKey(x, y, z), type); }
function worldDataGet(x, y, z) {
    let b = worldBlocks.get(blockKey(x, y, z));
    return (b && b !== 'water') ? b : null;
}

function addChatMessage(sender, text, color = "#fff") {
    const chat = document.getElementById('chat');
    const msg = document.createElement('div');
    msg.className = 'chat-msg';
    msg.style.color = color;
    msg.innerText = `<${sender}> ${text}`;
    chat.appendChild(msg);
    if(chat.children.length > 7) chat.removeChild(chat.children[0]);
}

// --- ЧАНКИ ---
function generateChunkData(cx, cz) {
    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            let wx = cx * CHUNK_SIZE + x;
            let wz = cz * CHUNK_SIZE + z;
            let surface = getTerrainHeight(wx, wz);

            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let key = blockKey(wx, y, wz);
                if (worldBlocks.has(key)) continue;

                let type = null;
                let isCave = y < surface - 2 && (Math.sin(wx*0.25) + Math.cos(y*0.35) + Math.sin(wz*0.25) > 1.2);

                if (!isCave) {
                    if (y === surface) type = (y <= WATER_LEVEL + 1) ? 'dirt' : 'grass';
                    else if (y < surface && y > surface - 4) type = 'dirt';
                    else if (y <= surface - 4) type = 'stone';
                    else if (y <= WATER_LEVEL) type = 'water';
                }
                if (type) worldDataSet(wx, y, wz, type);
            }
            if (surface > WATER_LEVEL + 1 && hash2D(wx, wz) < 0.012) {
                for(let h=1; h<=4; h++) worldDataSet(wx, surface+h, wz, 'wood');
            }
        }
    }
}

function buildChunkMesh(cx, cz) {
    let key = chunkKey(cx, cz);
    if (chunks.has(key)) return;

    const group = new THREE.Group();
    const instanced = {};
    const counts = {};

    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let type = worldBlocks.get(blockKey(cx * CHUNK_SIZE + x, y, cz * CHUNK_SIZE + z));
                if (type) counts[type] = (counts[type] || 0) + 1;
            }
        }
    }

    Object.keys(counts).forEach(type => {
        instanced[type] = {
            mesh: new THREE.InstancedMesh(blockGeometry, blockMaterials[type], counts[type]),
            idx: 0
        };
        group.add(instanced[type].mesh);
    });

    const dummy = new THREE.Object3D();
    for (let x = 0; x < CHUNK_SIZE; x++) {
        for (let z = 0; z < CHUNK_SIZE; z++) {
            for (let y = 0; y < CHUNK_HEIGHT; y++) {
                let wx = cx * CHUNK_SIZE + x;
                let wz = cz * CHUNK_SIZE + z;
                let type = worldBlocks.get(blockKey(wx, y, wz));
                if (!type) continue;

                dummy.position.set(wx, y, wz);
                dummy.updateMatrix();
                instanced[type].mesh.setMatrixAt(instanced[type].idx, dummy.matrix);
                instanced[type].idx++;
            }
        }
    }
    scene.add(group);
    chunks.set(key, group);
}

function updateChunksAroundPlayer() {
    let pX = Math.floor(player.pos.x / CHUNK_SIZE);
    let pZ = Math.floor(player.pos.z / CHUNK_SIZE);
    for (let x = -RENDER_DISTANCE; x <= RENDER_DISTANCE; x++) {
        for (let z = -RENDER_DISTANCE; z <= RENDER_DISTANCE; z++) {
            generateChunkData(pX + x, pZ + z);
            buildChunkMesh(pX + x, pZ + z);
        }
    }
    document.getElementById('chunk-count').innerText = chunks.size;
}

function rebuildTargetChunk(x, z) {
    let cx = Math.floor(x / CHUNK_SIZE);
    let cz = Math.floor(z / CHUNK_SIZE);
    let key = chunkKey(cx, cz);
    if (chunks.has(key)) {
        scene.remove(chunks.get(key));
        chunks.delete(key);
    }
    buildChunkMesh(cx, cz);
}

// --- МАНЕЖНЫЕ МОБЫ ---
class MinecraftMob {
    constructor(x, z, type = 'pig') {
        this.group = new THREE.Group();
        let color = type === 'pig' ? 0xff9999 : 0xeeeeee;
        let mat = new THREE.MeshLambertMaterial({ color: color });

        this.body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 1.4), mat);
        this.body.position.set(0, 0.6, 0);
        this.group.add(this.body);

        this.head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), mat);
        this.head.position.set(0, 1.1, -0.7);
        this.group.add(this.head);

        let legGeo = new THREE.BoxGeometry(0.25, 0.6, 0.25);
        this.legs = [];
        for (let i = 0; i < 4; i++) {
            let leg = new THREE.Mesh(legGeo, mat);
            this.legs.push(leg);
            this.group.add(leg);
        }
        this.legs[0].position.set(-0.3, 0.15, -0.4);
        this.legs[1].position.set(0.3, 0.15, -0.4);
        this.legs[2].position.set(-0.3, 0.15, 0.4);
        this.legs[3].position.set(0.3, 0.15, 0.4);

        this.pos = new THREE.Vector3(x, getTerrainHeight(x, z) + 2, z);
        this.group.position.copy(this.pos);
        scene.add(this.group);

        this.vel = new THREE.Vector3();
        this.moveDir = new THREE.Vector3();
        this.changeDirTimer = 0;
        this.animTime = 0;
    }

    update(dt) {
        this.changeDirTimer -= dt;
        if (this.changeDirTimer <= 0) {
            this.changeDirTimer = 3 + Math.random() * 4;
            this.moveDir.set(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
            this.group.lookAt(this.pos.x + this.moveDir.x, this.pos.y, this.pos.z + this.moveDir.z);
        }

        this.vel.x = this.moveDir.x * 1.5;
        this.vel.z = this.moveDir.z * 1.5;
        this.vel.y -= 16 * dt;

        let nextX = this.pos.x + this.vel.x * dt;
        let nextZ = this.pos.z + this.vel.z * dt;
        let nextY = this.pos.y + this.vel.y * dt;

        if (worldDataGet(nextX, this.pos.y, this.pos.z) || worldDataGet(this.pos.x, this.pos.y, nextZ)) {
            this.vel.y = 5.5; 
        }

        if (!worldDataGet(nextX, this.pos.y, this.pos.z) && !worldDataGet(nextX, this.pos.y - 1, this.pos.z)) this.pos.x = nextX;
        if (!worldDataGet(this.pos.x, this.pos.y, nextZ) && !worldDataGet(this.pos.x, this.pos.y - 1, nextZ)) this.pos.z = nextZ;

        let groundY = getTerrainHeight(this.pos.x, this.pos.z) + 0.1;
        if (nextY < groundY) {
            this.vel.y = 0;
            this.pos.y = groundY;
        } else {
            this.pos.y = nextY;
        }

        this.group.position.copy(this.pos);

        this.animTime += dt * 7;
        let angle = Math.sin(this.animTime) * 0.5;
        this.legs[0].rotation.x = angle;
        this.legs[3].rotation.x = angle;
        this.legs[1].rotation.x = -angle;
        this.legs[2].rotation.x = -angle;
    }
}

// --- СЕТЕВЫЕ ИГРОКИ (БОТЫ ДЛЯ СЕТИ) ---
class RemotePlayer {
    constructor(name, skinColor) {
        this.name = name;
        this.group = new THREE.Group();
        
        let mat = new THREE.MeshLambertMaterial({ color: skinColor });
        this.head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), mat);
        this.head.position.y = 1.6;
        
        this.body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.25), new THREE.MeshLambertMaterial({ color: 0x00cccc }));
        this.body.position.y = 1.05;

        this.group.add(this.head);
        this.group.add(this.body);

        this.pos = new THREE.Vector3((Math.random() - 0.5)*20, 15, (Math.random() - 0.5)*20);
        this.group.position.copy(this.pos);
        scene.add(this.group);

        this.actionTimer = 0;
        this.targetDir = new THREE.Vector3();
    }
    update(dt) {
        this.actionTimer -= dt;
        if(this.actionTimer <= 0) {
            this.actionTimer = 3 + Math.random()*4;
            this.targetDir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize();
            
            if(Math.random() < 0.3) {
                let phrases = ["Йоу!", "Кто строить со мной?", "Ищу алмазы", "Смотри какой холм"];
                addChatMessage(this.name, phrases[Math.floor(Math.random()*phrases.length)], "#55ffff");
            }
        }

        let speed = 4.0;
        this.pos.x += this.targetDir.x * speed * dt;
        this.pos.z += this.targetDir.z * speed * dt;
        this.pos.y = getTerrainHeight(this.pos.x, this.pos.z) + 0.1;

        this.group.position.copy(this.pos);
        this.group.lookAt(this.pos.x + this.targetDir.x, this.pos.y, this.pos.z + this.targetDir.z);
    }
}

// --- ЖЕЛЕЗНАЯ ФИЗИКА И ПРЫЖОК ГЛАВНОГО ИГРОКА ---
class PlayerPhysics {
    constructor() {
        this.pos = new THREE.Vector3(0, 20, 0);
        this.vel = new THREE.Vector3();
        this.height = 1.8;
        this.isSprinting = false;
    }
    update(dt, moveDir, jumpPressed) {
        // Сила тяжести
        this.vel.y -= 24 * dt;

        let speed = this.isSprinting ? 9.5 : 5.2;
        this.vel.x = moveDir.x * speed;
        this.vel.z = moveDir.z * speed;

        // Фикс прыжка: Берем железную высоту блока прямо под ногами игрока
        let currentGroundY = getTerrainHeight(this.pos.x, this.pos.z) + this.height;

        if (this.pos.y <= currentGroundY + 0.05) {
            this.vel.y = Math.max(0, this.vel.y);
            this.pos.y = currentGroundY; // Корректируем привязку к полу

            // Если прожали Пробел — сразу выталкиваем вверх
            if (jumpPressed) {
                this.vel.y = 8.5; 
            }
        }

        // Движение вперед/назад/вбок
        let nextX = this.pos.x + this.vel.x * dt;
        if (!worldDataGet(nextX, this.pos.y - 0.5, this.pos.z)) this.pos.x = nextX;

        let nextZ = this.pos.z + this.vel.z * dt;
        if (!worldDataGet(this.pos.x, this.pos.y - 0.5, nextZ)) this.pos.z = nextZ;

        // Движение по высоте
        this.pos.y += this.vel.y * dt;

        if (this.pos.y < -30) this.pos.set(0, 20, 0);
    }
}

const player = new PlayerPhysics();
let isLocked = false;
let selectedBlock = 'grass';
let multiplayerMode = false;

// --- СТРОИТЕЛЬСТВО ---
function interactWorld(isDestroy) {
    if (!isLocked) return;
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const intersects = raycaster.intersectObjects(Array.from(chunks.values()), true);
    
    if (intersects.length > 0 && intersects[0].distance < 6) {
        let hit = intersects[0];
        let p = hit.point;
        let n = hit.face.normal;

        let bx = Math.round(p.x - n.x * 0.5);
        let by = Math.round(p.y - n.y * 0.5);
        let bz = Math.round(p.z - n.z * 0.5);

        if (isDestroy) {
            worldBlocks.delete(blockKey(bx, by, bz));
            rebuildTargetChunk(bx, bz);
        } else {
            let px = bx + n.x;
            let py = by + n.y;
            let pz = bz + n.z;
            worldBlocks.set(blockKey(px, py, pz), selectedBlock);
            rebuildTargetChunk(px, pz);
        }
    }
}

// --- КЛАВИАТУРА И МЫШЬ ---
const keys = { w: false, a: false, s: false, d: false, space: false };
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') keys.space = true;
    if (e.key === 'w' || e.key === 'ц') keys.w = true;
    if (e.key === 's' || e.key === 'ы') keys.s = true;
    if (e.key === 'a' || e.key === 'ф') keys.a = true;
    if (e.key === 'd' || e.key === 'в') keys.d = true;
    if (e.key === 'Shift') player.isSprinting = true;
    
    if (['1','2','3','4'].includes(e.key)) {
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
        let slots = document.querySelectorAll('.slot');
        let idx = parseInt(e.key) - 1;
        slots[idx].classList.add('active');
        selectedBlock = slots[idx].dataset.block;
    }
});
window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') keys.space = false;
    if (e.key === 'w' || e.key === 'ц') keys.w = false;
    if (e.key === 's' || e.key === 'ы') keys.s = false;
    if (e.key === 'a' || e.key === 'ф') keys.a = false;
    if (e.key === 'd' || e.key === 'в') keys.d = false;
    if (e.key === 'Shift') player.isSprinting = false;
});

window.addEventListener('mousedown', (e) => {
    if(e.button === 0) interactWorld(true);
    if(e.button === 2) interactWorld(false);
});

let pitch = 0, yaw = 0;
document.addEventListener('mousemove', (e) => {
    if (!isLocked) return;
    yaw -= e.movementX * 0.0025;
    pitch -= e.movementY * 0.0025;
    pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
});

// --- СИСТЕМА ЗАПУСКА РЕЖИМОВ (ФИКС КНОПОК) ---
function initGame(multi) {
    multiplayerMode = multi;
    document.getElementById('game-mode').innerText = multi ? "Мультиплеер" : "Одиночный";
    
    if(multi) {
        if(remotePlayers.length === 0) {
            remotePlayers.push(new RemotePlayer("Notch_Fan", 0xffdd99));
            remotePlayers.push(new RemotePlayer("Alex_33", 0x88ff88));
            remotePlayers.push(new RemotePlayer("Mr_Gamer", 0xff8888));
        }
        document.getElementById('player-count').innerText = "4";
    } else {
        document.getElementById('player-count').innerText = "1";
    }
    document.body.requestPointerLock();
}

// Жесткая привязка ивентов по ID элементов кнопок
document.getElementById('start-solo').onclick = function() { initGame(false); };
document.getElementById('start-multi').onclick = function() { initGame(true); };

document.addEventListener('pointerlockchange', () => {
    isLocked = document.pointerLockElement === document.body;
    if(isLocked) {
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
    } else {
        document.getElementById('main-menu').style.display = 'flex';
        document.getElementById('game-ui').style.display = 'none';
    }
});

// МОБЫ
for(let i=0; i<15; i++) {
    mobs.push(new MinecraftMob((Math.random()-0.5)*60, (Math.random()-0.5)*60, Math.random() > 0.5 ? 'pig' : 'sheep'));
}

// --- ИГРОВОЙ ЦИКЛ ---
const clock = new THREE.Clock();
function loop() {
    requestAnimationFrame(loop);
    const dt = Math.min(clock.getDelta(), 0.1);

    if (isLocked) {
        const front = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
        const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        front.y = 0; front.normalize();
        side.y = 0; side.normalize();

        let moveDir = new THREE.Vector3();
        if (keys.w) moveDir.add(front);
        if (keys.s) moveDir.sub(front);
        if (keys.d) moveDir.add(side);
        if (keys.a) moveDir.sub(side);
        moveDir.normalize();

        player.update(dt, moveDir, keys.space);
        camera.position.copy(player.pos);
        camera.position.y -= 0.15; 

        let targetFOV = player.isSprinting ? 82 : 70;
        if(camera.fov !== targetFOV) {
            camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.1);
            camera.updateProjectionMatrix();
        }

        updateChunksAroundPlayer();
        mobs.forEach(mob => mob.update(dt));

        if(multiplayerMode) {
            remotePlayers.forEach(p => p.update(dt));
        }

        document.getElementById('pos-x').innerText = Math.round(player.pos.x);
        document.getElementById('pos-y').innerText = Math.round(player.pos.y);
        document.getElementById('pos-z').innerText = Math.round(player.pos.z);
    }
    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

loop();
</script>
</body>
</html>
